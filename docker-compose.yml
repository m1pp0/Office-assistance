services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: office_assistant_api
    ports:
      - "8080:8000"
    volumes:
      - db_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/office.db
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

volumes:
  db_data: